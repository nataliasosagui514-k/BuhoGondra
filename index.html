<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BúhoGondra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <button type="button" class="boton-volver" id="boton-volver" aria-label="Volver" hidden>
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5L8 12L15 19"/>
      </svg>
    </button>
    <h1 id="titulo-pantalla">BúhoGondra</h1>
  </header>

  <main id="contenido"></main>

  <!-- Iconos tomados de Figma; en línea para que cambien de color con el texto -->
  <nav id="navegacion-inferior" class="barra-navegacion" aria-label="Navegación principal">
    <ul>
      <li>
        <a class="pestana" href="#/menu">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5.5 3V8C5.5 8.66304 5.76339 9.29893 6.23223 9.76777C6.70107 10.2366 7.33696 10.5 8 10.5C8.66304 10.5 9.29893 10.2366 9.76777 9.76777C10.2366 9.29893 10.5 8.66304 10.5 8V3"/>
            <path d="M8 3V21"/>
            <path d="M17.5 21V3C15.2 4.4 14 7 14 10.2V14H17.5"/>
          </svg>
          <span>Menú</span>
        </a>
      </li>
      <li>
        <a class="pestana" href="#/puntos">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"/>
            <path d="M12 7.5L13.18 10.78L16.66 10.89L13.9 13.02L14.88 16.36L12 14.4L9.12 16.36L10.1 13.02L7.34 10.89L10.82 10.78L12 7.5Z"/>
          </svg>
          <span>Puntos</span>
        </a>
      </li>
      <li>
        <a class="pestana" href="#/mas">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7H20"/>
            <path d="M4 12H15"/>
            <path d="M4 17H20"/>
          </svg>
          <span>Más</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="zona-avisos" id="zona-avisos" role="status"></div>

  <!-- Plantilla que comparten las pantallas; el título se muestra en el encabezado -->
  <template id="plantilla-pantalla">
    <p class="mensaje-construccion">Pantalla en construcción</p>
  </template>

  <!-- Menú de hoy (Figma 1175:7562) -->
  <template id="plantilla-menu">
    <div class="menu">
      <header class="menu__encabezado">
        <div class="menu__titulos">
          <p class="menu__fecha"></p>
          <h1 class="menu__titulo">Menú de hoy</h1>
        </div>
        <!-- Botón de icono (Figma 1175:7568) -->
        <a class="boton-icono menu__calendario" href="#/semana" aria-label="Menú de la semana">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10H21M8 3V7M16 3V7M6 5H18C18.7956 5 19.5587 5.31607 20.1213 5.87868C20.6839 6.44129 21 7.20435 21 8V18C21 18.7956 20.6839 19.5587 20.1213 20.1213C19.5587 20.6839 18.7956 21 18 21H6C5.20435 21 4.44129 20.6839 3.87868 20.1213C3.31607 19.5587 3 18.7956 3 18V8C3 7.20435 3.31607 6.44129 3.87868 5.87868C4.44129 5.31607 5.20435 5 6 5Z"/>
          </svg>
        </a>
      </header>

      <!-- Se reemplaza por un aviso cuando el día no tiene menú -->
      <div class="menu__del-dia">
        <aside class="anuncio">
          <div class="anuncio__textos">
            <p class="anuncio__antetitulo">RECUERDA</p>
            <h2 class="anuncio__titulo"></h2>
            <p class="anuncio__texto"></p>
          </div>
          <img class="anuncio__imagen" src="img/buho-anuncio.png" alt="" width="112" height="112">
        </aside>

        <!-- Aquí se copia la plantilla de categorías y tarjetas -->
        <div class="menu__lista"></div>
      </div>
    </div>
  </template>

  <!-- Menú de la semana (Figma 1176:7342) -->
  <template id="plantilla-semana">
    <div class="menu">
      <header class="encabezado-interno">
        <h1 class="semana__titulo">Menú de la semana</h1>
      </header>

      <div class="semana__seleccion">
        <div class="dias" role="group" aria-label="Días de la semana"></div>
        <div class="semana__dia">
          <h2 class="semana__fecha" aria-live="polite"></h2>
          <div class="semana__aviso"></div>
        </div>
      </div>

      <!-- Categorías y tarjetas, o el aviso de día sin menú -->
      <div class="menu__lista"></div>
    </div>
  </template>

  <!-- Categorías y tarjetas: las comparten el Menú de hoy y el de la semana.
       Iconos de categoría tomados de Figma -->
  <template id="plantilla-categorias">
    <div class="categorias" role="group" aria-label="Categorías">
      <button type="button" class="categoria categoria--economicos" data-categoria="economicos">
        <span class="categoria__cuadro">
          <svg class="categoria__icono" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2.5 10.17V3.75C2.5 3.42 2.63 3.1 2.87 2.87C3.1 2.63 3.42 2.5 3.75 2.5H10.17C10.34 2.49 10.5 2.52 10.66 2.57C10.82 2.63 10.96 2.72 11.08 2.83L17.17 8.92C17.4 9.15 17.52 9.46 17.52 9.79C17.52 10.12 17.4 10.43 17.17 10.67L10.92 16.92C10.68 17.15 10.37 17.27 10.04 17.27C9.71 17.27 9.4 17.15 9.17 16.92L2.83 11.08C2.72 10.96 2.63 10.82 2.57 10.66C2.52 10.5 2.49 10.33 2.5 10.17Z"/>
            <path d="M7.42 6.33C7.42 6.93 6.93 7.42 6.33 7.42C5.73 7.42 5.25 6.93 5.25 6.33C5.25 5.73 5.73 5.25 6.33 5.25C6.93 5.25 7.42 5.73 7.42 6.33Z"/>
          </svg>
        </span>
        <span class="categoria__nombre">Económicos</span>
      </button>
      <button type="button" class="categoria categoria--platos-fuertes" data-categoria="platos-fuertes">
        <span class="categoria__cuadro">
          <svg class="categoria__icono" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3.33 14.17C3.33 12.4 4.04 10.7 5.29 9.45C6.54 8.2 8.23 7.5 10 7.5C11.77 7.5 13.46 8.2 14.71 9.45C15.96 10.7 16.67 12.4 16.67 14.17"/>
            <path d="M2.08 14.17H17.92"/>
            <path d="M3.33 17.08H16.67"/>
            <path d="M10 7.5V6.17"/>
            <path d="M10.83 5.25C10.83 5.71 10.46 6.08 10 6.08C9.54 6.08 9.17 5.71 9.17 5.25C9.17 4.79 9.54 4.42 10 4.42C10.46 4.42 10.83 4.79 10.83 5.25Z"/>
          </svg>
        </span>
        <span class="categoria__nombre">Platos fuertes</span>
      </button>
      <button type="button" class="categoria categoria--complementos" data-categoria="complementos">
        <span class="categoria__cuadro">
          <svg class="categoria__icono" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M4.58 8.33H15.42L14.33 17.5H5.67L4.58 8.33Z"/>
            <path d="M7.08 8.33V3.75"/>
            <path d="M10 8.33V2.5"/>
            <path d="M12.92 8.33V3.75"/>
          </svg>
        </span>
        <span class="categoria__nombre">Complementos</span>
      </button>
      <button type="button" class="categoria categoria--tipicos" data-categoria="tipicos">
        <span class="categoria__cuadro">
          <svg class="categoria__icono" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2.08 15.02C1.55 14.47 1.2 13.78 1.06 13.04C0.92 12.3 0.99 11.53 1.27 10.82C1.55 10.12 2.03 9.52 2.65 9.08C3.26 8.64 3.99 8.39 4.75 8.35C4.72 7.73 4.88 7.12 5.19 6.58C5.51 6.05 5.97 5.61 6.52 5.33C7.07 5.05 7.7 4.94 8.31 5C8.93 5.06 9.52 5.3 10 5.69C10.48 5.3 11.07 5.06 11.69 5C12.3 4.94 12.93 5.05 13.48 5.33C14.03 5.61 14.49 6.05 14.81 6.58C15.12 7.12 15.28 7.73 15.25 8.35C16.01 8.39 16.74 8.64 17.35 9.08C17.97 9.52 18.45 10.12 18.73 10.82C19.01 11.53 19.08 12.3 18.94 13.04C18.8 13.78 18.45 14.47 17.93 15.02C12.64 8.8 7.36 8.8 2.08 15.02Z"/>
          </svg>
        </span>
        <span class="categoria__nombre">Típicos</span>
      </button>
    </div>

    <section aria-labelledby="menu-categoria">
      <div class="menu__titulo-categoria">
        <h2 class="menu__categoria" id="menu-categoria"></h2>
        <p class="menu__conteo" aria-live="polite"></p>
      </div>
      <p class="menu__nota" hidden></p>
      <ul class="menu__rejilla"></ul>
    </section>
  </template>

  <!-- Comentarios y calificaciones (Figma 1190:7381; sin opiniones, 1440:11032) -->
  <template id="plantilla-comentarios">
    <div class="menu">
      <header class="encabezado-interno">
        <h1>Comentarios y calificaciones</h1>
      </header>

      <div class="opiniones">
        <!-- Aquí va la fila del platillo -->
        <div class="opiniones__cuerpo">
          <section class="resumen" aria-label="Resumen de calificaciones">
            <div class="resumen__promedio">
              <p class="resumen__numero"></p>
              <p class="resumen__conteo"></p>
            </div>
            <ul class="resumen__barras"></ul>
          </section>

          <!-- Solo se ve cuando el platillo no tiene opiniones -->
          <section class="sin-opiniones">
            <img class="sin-opiniones__imagen" src="img/buhi-sin-opiniones.png" alt="" width="126" height="126">
            <h2 class="sin-opiniones__titulo">Todavía no hay opiniones</h2>
            <p class="sin-opiniones__texto">Sé la primera persona en calificar este platillo.</p>
          </section>

          <a class="boton opiniones__escribir">Escribir mi opinión</a>

          <section class="opiniones__lista" aria-labelledby="titulo-opiniones">
            <div class="opiniones__titulo">
              <h2 id="titulo-opiniones">Opiniones</h2>
              <p>Más recientes primero</p>
            </div>
            <ul class="lista-opiniones"></ul>
            <button type="button" class="boton boton--texto opiniones__ver-mas">Ver más</button>
          </section>
        </div>
      </div>
    </div>
  </template>

  <!-- Escribir mi opinión (Figma 1190:7510) -->
  <template id="plantilla-escribir">
    <div class="menu escribir">
      <header class="encabezado-interno">
        <h1>Escribir mi opinión</h1>
      </header>

      <form class="opiniones formulario-opinion">
        <!-- Aquí va la fila del platillo -->
        <div class="formulario-opinion__campos">
          <fieldset class="calificar">
            <legend class="calificar__pregunta">¿Qué te pareció?</legend>
            <!-- Aquí van las cinco estrellas -->
            <div class="selector-estrellas"></div>
            <p class="calificar__texto" aria-live="polite"></p>
          </fieldset>

          <!-- Campo de texto (Figma 725:2427) -->
          <div class="campo">
            <label class="campo__etiqueta" for="opinion-texto">Tu comentario (opcional)</label>
            <input class="campo__entrada" id="opinion-texto" type="text" maxlength="200" autocomplete="off" aria-describedby="opinion-contador">
            <p class="campo__ayuda" id="opinion-contador"></p>
          </div>
        </div>

        <button type="submit" class="boton boton--primario formulario-opinion__publicar">Publicar</button>
      </form>
    </div>
  </template>

  <!-- Pantallas de Apartar (Figma 1346:8841 y sección 1374:9386); se llenan en
       js/vista-pedido.js -->
  <template id="plantilla-apartar">
    <div class="menu">
      <header class="encabezado-interno">
        <h1></h1>
      </header>
    </div>
  </template>

  <!-- Tu ticket (Figma 1374:9674) -->
  <template id="plantilla-ticket">
    <div class="ticket-pantalla"></div>
  </template>

  <!-- Puntos (Figma 1003:4398); se llena en js/vista-puntos.js -->
  <template id="plantilla-puntos">
    <div class="puntos">
      <header class="puntos__encabezado">
        <h1 class="puntos__titulo">Puntos</h1>
        <a class="boton boton--texto boton--pequeno puntos__ayuda" href="#/puntos/ayuda">¿Cómo funciona?</a>
      </header>
      <div class="puntos__progreso"></div>
      <section class="puntos__premios" aria-labelledby="titulo-premios">
        <div class="puntos__intro">
          <h2 id="titulo-premios">Tus premios</h2>
          <p>Cada nivel desbloquea un premio. Recógelo en cualquier cafetería UCA.</p>
        </div>
        <ul class="premios"></ul>
      </section>
    </div>
  </template>

  <!-- Ayuda de puntos (Figma 1003:4524) -->
  <template id="plantilla-ayuda-puntos">
    <div class="menu ayuda-pantalla">
      <header class="encabezado-interno"></header>
      <div class="ayuda">
        <div class="ayuda__titulos">
          <h1>Puntos y premios</h1>
          <p>Compra, acumula puntos y gana búhopremios.</p>
        </div>
        <div class="ayuda__preguntas"></div>
        <!-- Aquí va el aviso "Importante" -->
      </div>
    </div>
  </template>

  <!-- Pantallas de cuenta (Figma, "Bloque 1"); se llenan en js/vista-cuenta.js -->
  <template id="plantilla-cuenta">
    <div class="cuenta"></div>
  </template>

  <!-- Contenedor de la ruta oculta #/componentes -->
  <template id="plantilla-componentes">
    <div class="catalogo"></div>
  </template>

  <script src="js/componentes.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/cuenta.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/pedido.js"></script>
  <script src="js/puntos.js"></script>
  <script src="js/notificaciones.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/vista-menu.js"></script>
  <script src="js/vista-comentarios.js"></script>
  <script src="js/vista-pedido.js"></script>
  <script src="js/vista-puntos.js"></script>
  <script src="js/vista-cuenta.js"></script>
  <script src="js/vista-mas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
